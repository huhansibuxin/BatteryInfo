name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Build with xcodebuild
        run: |
          xcodebuild \
            -project BatteryInfo.xcodeproj \
            -scheme BatteryInfo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Sign and Package IPA
        run: |
          APP_PATH="./build/Build/Products/Release-iphoneos/BatteryInfo.app"

          echo "App path: ${APP_PATH}"
          if [ ! -d "${APP_PATH}" ]; then
            echo "Looking for .app..."
            find ./build -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          # Sign with ldid
          ldid -Sentitlements.plist "${APP_PATH}"
          rm -rf "${APP_PATH}/_CodeSignature"

          # Copy RootHelper
          cp -f SettingsBatteryHelper/SettingsBatteryHelper "${APP_PATH}/"

          # Create IPA
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -r BatteryInfo.ipa Payload
          rm -rf Payload

          mkdir -p packages
          cp BatteryInfo.ipa packages/
          echo "IPA size: $(ls -lh packages/BatteryInfo.ipa | awk '{print $5}')"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryInfo-ipa
          path: packages/BatteryInfo.ipa
          if-no-files-found: error
