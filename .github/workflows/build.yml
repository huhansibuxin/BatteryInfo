name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          THEOS=/opt/theos
          echo "THEOS=${THEOS}" >> $GITHUB_ENV
          if [ -d "$THEOS/.git" ]; then
            echo "[CI] Theos already exists, pulling latest..."
            cd $THEOS && git pull
            sudo chown -R $(whoami):staff $THEOS
          else
            echo "[CI] Cloning Theos..."
            sudo git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git $THEOS
            sudo chown -R $(whoami):staff $THEOS
          fi

      - name: Update Theos Vendors
        run: |
          ${THEOS}/bin/update-theos

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make

      - name: Build IPA
        run: |
          make package PACKAGE_FORMAT=ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryInfo-tipa
          path: packages/*.tipa
          if-no-files-found: error
